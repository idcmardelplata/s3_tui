[package]
name = "s3_tui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI manager for AWS S3"
license = "MIT"

[dependencies]
# TUI
ratatui = { version = "0.30", features = ["crossterm"] }
ratatui-themekit = "0.6"
crossterm = "0.28"

# AWS S3
aws-config = { version = "1.6", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.63"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
bytesize = "1.3"
ignore = "0.4"
clap = { version = "4.6.6", features = ["derive", "env"] }
rusqlite = "0.40.2"
